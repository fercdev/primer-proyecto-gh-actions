name: CI-CD Pipeline completo

on:
  push:
    branches: [ "master", "develop"]
  pull_request:
    branches: [ "develop"]
  workflow_dispatch:


env:
  NODE_ENV: production
  NODE_VERSION: "20.x"
  DOCKER_IMAGE: "fercdevv/app-node:latest"
  MI_TOKEN: ${{ secrets.MI_TOKEN }}


jobs:
  build:
    name: Build application
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      JOB_VAR: "This is a job-level variable"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

        env:
          STEP_VAR: "This is a step-level variable"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: cache de dependencias
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{hashFiles('package-lock.json')}}

      - name: Install dependencies
        run: npm install

      - name: Build application
        run: npm run build

      - name: Show environment variables
        run: |
          echo "This is a variable: ${{ env.MI_TOKEN }}"
          echo "This is a secret variable: ${{ secrets.MI_TOKEN }}"
  test:
    name: Run application tests
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    if: ${{ needs.build.result == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test
  docker-deploy:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: [build, test]

    if: github.ref == 'refs/heads/master' && needs.build.result == 'success' && needs.test.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # - name: login dockerhub
      #   run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE }}